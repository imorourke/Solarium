[package]
name = "visual-jib"
edition = "2024"
description = "Visual emulator of the standard Jib computer with code editing and debugging capabilities"
version.workspace = true
authors.workspace = true
documentation.workspace = true

[features]
nothread = []

[dependencies]
jib-cpu = { workspace = true }
jib-computer = { workspace = true }
jib-asm = { workspace = true }
cblang = { workspace = true }
cbfs-lib = { path = "../cbfs/cbfs-lib", version = "*", default-features = false }
eframe = "0.35"
image = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
log = "0.4"

[build-dependencies]
chrono = "0.4.43"

[package.metadata.packager]
product-name = "VisualJib"
identifier = "io.github.imorourke.VisualJib"
icons = ["../doc/images/logo.png"]
category = "DeveloperTool"
linux.generate-desktop-entry = true
