[package]
name = "visual-jib"
edition = "2024"
description = "Visual emulator of the standard Jib computer with code editing and debugging capabilities"
version.workspace = true
authors.workspace = true
documentation.workspace = true

[features]
nothread = []

[dependencies]
jib-asm.workspace = true
jib-computer.workspace = true
jib-cpu.workspace = true
jib-os.workspace = true
jib-os-image.workspace = true
cblang.workspace = true
cbfs-lib.workspace = true
eframe = "0.36"
image = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-stopwatch = "0.2"
web-sys = "0.3"
log = "0.4"

[package.metadata.packager]
product-name = "VisualJib"
identifier = "io.github.imorourke.VisualJib"
icons = ["../doc/images/logo.png"]
category = "DeveloperTool"
linux.generate-desktop-entry = true
